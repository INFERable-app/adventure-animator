    :root {

      --card-bg: #1e293b;

      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header & Navigation */
    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #090d16;
      padding: 12px 24px;
      border-bottom: 1px solid #334155;
      z-index: 10001;
      flex-shrink: 0;
    }

    .title-brand {
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      color: #60a5fa;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: #334155;
      color: #ffffff;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    /* Tab Views */
    .tab-content {
      display: none;
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .tab-content.active {
      display: flex;
    }

    /* Player Canvas Container */
    #player-tab {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    /* Controls Overlay */
    .controls-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.9);
      padding: 12px 24px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .control-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .control-btn:hover {
      background: #1d4ed8;
    }

    /* Initial Loading Overlay Screen */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #090d16;
      color: #60a5fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 1px;
      transition: opacity 0.5s ease-out;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #1e293b;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* JSON Viewer Tab */
    #json-tab {
      padding: 20px;
      box-sizing: border-box;
      background-color: #0f172a;
    }

    pre {
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #38edf8;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #334155;
      overflow: auto;
      font-family: "Courier New", Courier, monospace;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    /* Vector Sprites & Text Styles */
    .vector-sprite {
      pointer-events: none;
      transform: translate(-50%, -50%);
      position: absolute;
      z-index: 500;
    }

    .vector-text {
      text-align: center;
      white-space: nowrap;
      user-select: none;

    /*
     * 2. VECTOR RENDERER ENGINE
     */
    function renderVectorPose(container, poseOrObject) {
      if (poseOrObject.type === 'text') {
        const textDiv = document.createElement('div');
        textDiv.className = 'vector-text';
        textDiv.innerText = poseOrObject.text;
        textDiv.style.fontSize = (poseOrObject.fontSize || 16) + 'px';
        textDiv.style.color = poseOrObject.color || '#ffffff';
        textDiv.style.fontFamily = poseOrObject.fontFamily || 'sans-serif';
        textDiv.style.fontWeight = 'bold';
        container.appendChild(textDiv);
        return;
      }

      // --- PNG Image Support ---
      if (poseOrObject.type === 'image') {
        const img = document.createElement('img');
        img.src = poseOrObject.src;
        img.style.width = (poseOrObject.width || 600) + 'px';
        img.style.height = 'auto';
        img.style.display = 'block';
        container.appendChild(img);
        return;
      }

      let partsToRender = {};
      if (poseOrObject.parts) {
        partsToRender = poseOrObject.parts;
      } else {
        partsToRender = JSON.parse(JSON.stringify(masterGameData.baseParts));
        for (let key in poseOrObject) {
          if (partsToRender[key]) {
            Object.assign(partsToRender[key], poseOrObject[key]);
          }
        }
      }

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("width", "600");
      svg.setAttribute("height", "600");
      svg.setAttribute("viewBox", "-300 -300 600 600");

      const sortedKeys = Object.keys(partsToRender).sort((a, b) => 
        (partsToRender[a].zIndex || 0) - (partsToRender[b].zIndex || 0)
      );

      sortedKeys.forEach(key => {
        const part = partsToRender[key];
        let elem;

        if (part.type === 'circle') {
          elem = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          elem.setAttribute("cx", part.cx || 0);
          elem.setAttribute("cy", part.cy || 0);
          elem.setAttribute("r", part.r || 0);
        } else if (part.type === 'ellipse') {
          elem = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
          elem.setAttribute("cx", part.cx || 0);
          elem.setAttribute("cy", part.cy || 0);
          elem.setAttribute("rx", part.rx || 0);
          elem.setAttribute("ry", part.ry || 0);
        } else if (part.type === 'star') {
          elem = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
          let pts = [];
          for (let i = 0; i < part.points * 2; i++) {
            let r = (i % 2 === 0) ? part.r1 : part.r2;
            let angle = (i * Math.PI) / part.points;
            pts.push(`${part.cx + r * Math.sin(angle)},${part.cy - r * Math.cos(angle)}`);
          }
          elem.setAttribute("points", pts.join(" "));
        } else if (part.path) {
          elem = document.createElementNS("http://www.w3.org/2000/svg", "path");
          let d = "";
          if (Array.isArray(part.path)) {
            d = part.path.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(" ");
            if (part.fill && part.fill !== "transparent" && part.fill !== "none") {
              d += " Z";
            }
          } else if (typeof part.path === 'string') {
            d = part.path;
          }
          elem.setAttribute("d", d);
        }

        if (elem) {
          elem.setAttribute("fill", part.fill || "none");
          elem.setAttribute("stroke", part.stroke || "none");
          elem.setAttribute("stroke-width", part.strokeWidth || 0);
          if (part.lineCap) elem.setAttribute("stroke-linecap", part.lineCap);
          if (part.lineJoin) elem.setAttribute("stroke-linejoin", part.lineJoin);
          svg.appendChild(elem);
        }
      });

      container.appendChild(svg);
    }

    /*
     * 3. PLAYER HELPER & FADE API
     */
    const activeSprites = new Map();
    let spriteIdCounter = 0;

    function fadeIn(pose, x, y, seconds) {
      const spriteId = 'sprite_' + (++spriteIdCounter);
      const spriteNode = document.createElement('div');
      spriteNode.id = spriteId;
      spriteNode.className = 'vector-sprite';
      spriteNode.style.left = `${x}px`;
      spriteNode.style.top = `${y}px`;
      spriteNode.style.opacity = '0';
      spriteNode.style.transition = `opacity ${seconds}s ease-in-out`;

      renderVectorPose(spriteNode, pose);
      document.getElementById('canvas-container').appendChild(spriteNode);

      requestAnimationFrame(() => {
        spriteNode.style.opacity = '1';
      });

      activeSprites.set(spriteId, spriteNode);
      return spriteId;
    }

    function fadeOut(spriteId, seconds) {
      const spriteNode = activeSprites.get(spriteId);
      if (!spriteNode) return;

      spriteNode.style.transition = `opacity ${seconds}s ease-in-out`;
      spriteNode.style.opacity = '0';

      setTimeout(() => {
        if (spriteNode.parentNode) {
          spriteNode.parentNode.removeChild(spriteNode);
        }
        activeSprites.delete(spriteId);
      }, seconds * 1000);
    }

    function canvasFadeTo(color, seconds) {
      let overlay = document.getElementById('canvas-fade-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'canvas-fade-overlay';
        overlay.style.position = 'absolute';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.pointerEvents = 'none';
        overlay.style.zIndex = '100';
        document.getElementById('canvas-container').appendChild(overlay);
      }

      overlay.style.transition = `background-color ${seconds}s ease-in-out`;
      overlay.style.backgroundColor = color;
    }

    const wait = (sec) => new Promise(resolve => setTimeout(resolve, sec * 1000));

    function clearCanvas() {
      activeSprites.forEach((node, id) => {
        if (node && node.parentNode) {
          node.parentNode.removeChild(node);
        }
      });
      activeSprites.clear();
    }

    function createTextObject(textString, fontSize = 16) {
      return { type: 'text', text: textString, fontSize: fontSize, color: '#ffffff' };
    }

    function createImageObject(srcPath, width = 600) {
      return { type: 'image', src: srcPath, width: width };
    }

    /*
     * 4. ANIMATION SEQUENCE SCRIPT
     */
    async function playOpeningSequence() {
      clearCanvas();

      const container = document.getElementById('canvas-container');
      const centerX = container.clientWidth / 2;
      const centerY = container.clientHeight / 2;

      // Step 1: Black Canvas
      canvasFadeTo('black', 0);
      await wait(0.5);

      // Step 2: INFERable Presents
      const title1 = fadeIn(createTextObject("INFERable Presents"), centerX, centerY, 3.0);
      await wait(1.8);
      fadeOut(title1, 3.0);
      await wait(3.0);

      // Step 3: Breath of the Child
      const title2 = fadeIn(createTextObject("Breath of the Child", 16), centerX, centerY, 3.0);
      await wait(3.0);
      fadeOut(title2, 0.8);
      await wait(3.0);

      // Step 4: Lens Flare PNG Image
      const flareId = fadeIn(createImageObject('images/lens-flare.png', 800), centerX, centerY, 2);
      await wait(3,0);

      // Step 5: "...Open your eyes..."
      const subtitle1 = fadeIn(createTextObject("...Open your eyes...", 16), centerX, container.clientHeight - 120, 1.2);
      await wait(3.0);
      fadeOut(subtitle1, 3.0);
      await wait(1.0);
      
      // Step 6: Fade Canvas to White
      fadeOut(flareId, 3.0);
      const tentTopBrightId = fadeIn(createImageObject('images/tent-top-bright.png', 800), centerX, centerY, 3.0);
      await wait(3.0);
      fadeOut(tentTopBrightId, 3.0);
      const tentUpWashedId = fadeIn(createImageObject('images/tent-pov-looking-up-washed-out2.png', 800), centerX, centerY, 3.0);
      //canvasFadeTo('white', 6.0);
      await wait(3.0);

      // Step 7: POV Tent Looking Up -> Cross-fade to Tent Back
      fadeOut(tentUpWashedId, 3.0);
      const tentPovLookingUpId = fadeIn(createImageObject('images/tent-pov-looking-up.png', 800), centerX, centerY, 3.0);
      //canvasFadeTo('transparent', 3.0);
      await wait(8.0);


      // Step 8: Cut to Top Down Laying View with tent-floor.png Background
      const tentFloorBgId1 = fadeIn(createImageObject('images/tent-floor.png', 800), centerX, centerY, 0);
      const topMatId = fadeIn(masterGameData.objects.blueMatTopView, centerX, centerY, 0);
      const toddlerLayingId = fadeIn(masterGameData.poses.topDownLaying, centerX, centerY, 0);
      await wait(6.0);

      // Step 9: "Wake up." Text
      const subtitle2 = fadeIn(createTextObject("Wake up.", 16), centerX, container.clientHeight - 120, 3.0);
      await wait(3.0);
      fadeOut(subtitle2, 3.0);
      await wait(3.0);
      
      // Step 10: 2D Side Sitting View with tent-floor.png Background
      fadeOut(topMatId, 0);
      fadeOut(toddlerLayingId, 0);
      fadeOut(tentFloorBgId1, 0);

      const tentBackBgId2 = fadeIn(createImageObject('images/tent-back.png', 800), centerX, centerY, 0);
      const sideMatId = fadeIn(masterGameData.objects.blueMatSideView, centerX, centerY + 50, 0);
      const toddlerSittingId = fadeIn(masterGameData.poses.sideViewSitting, centerX, centerY + 59, 0);
      const monitorFloorId = fadeIn(masterGameData.objects.babyMonitor, centerX - 60, centerY + 119, 0);
      await wait(3.5);

      // Step 11: 2D Side Standing View holding Monitor with tent-back.png Background

      fadeOut(sideMatId, 0);
      fadeOut(toddlerSittingId, 0);
      fadeOut(monitorFloorId, 0);
      const toddlerStandingId = fadeIn(masterGameData.poses.sideViewStandingHold, centerX, centerY + 35, 0);
      const monitorHandId = fadeIn(masterGameData.objects.babyMonitor, centerX - 42, centerY + 50, 0);
    }

    /*
     * 5. TAB SWITCHING & SETUP
     */
    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      if (evt && evt.target) {
        evt.target.classList.add('active');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('json-display').textContent = JSON.stringify(masterGameData, null, 2);

      // Wait 2 animation frames for browser to paint layout before hiding loader and starting sequence
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const loader = document.getElementById('loading-overlay');
          if (loader) {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
          playOpeningSequence();
        });
      });
    });
  </script>
</head>
<body>

  <!-- Header / Tab Bar -->
  <header>
    <div class="title-brand">Breath of the Child - Sequence Player</div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('player-tab', event)">Animation Player</button>
      <button class="tab-btn" onclick="switchTab('json-tab', event)">JSON Source</button>
    </div>
  </header>

  <!-- TAB 1: Animation Player -->
  <div id="player-tab" class="tab-content active">
    <!-- Initial Loading Overlay -->
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div>Loading Sequence...</div>
    </div>

    <div id="canvas-container"></div>
    <div class="controls-overlay">
      <button class="control-btn" onclick="playOpeningSequence()">Replay Sequence</button>
    </div>
  </div>

  <!-- TAB 2: JSON Source Viewer -->
  <div id="json-tab" class="tab-content">
    <pre><code id="json-display">Loading JSON Data...</code></pre>
  </div>

</body>
</html>
